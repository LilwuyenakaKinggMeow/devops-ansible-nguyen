- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Nginx
  apt:
    name: "{{ nginx_package }}"
    state: present

- name: Ensure Nginx is enabled and running
  service:
    name: nginx
    enabled: yes
    state: started

- name: Deploy website
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nginx
